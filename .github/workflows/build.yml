name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Movie App
        run: |
          flutter create --org com.mycompany movieapp
          cd movieapp
          flutter pub add firebase_core cloud_firestore video_player chewie

          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "376902767306",
              "project_id": "ghjnj-f8e85",
              "storage_bucket": "ghjnj-f8e85.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:376902767306:android:414ce133c32f3bd2f05a33",
                  "android_client_info": {
                    "package_name": "com.mycompany.movieapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyD-cIoP5JQQdm0e3VW9xQrua4cEGkOrBA8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          sed -i '/apply from: "\$flutterRoot\/packages\/flutter_tools\/gradle\/flutter.gradle"/a apply plugin: "com.google.gms.google-services"' android/app/build.gradle || true
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk =.*/minSdk = 21/' android/app/build.gradle || true

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:video_player/video_player.dart';
          import 'package:chewie/chewie.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Firebase.initializeApp();
            } catch (_) {}
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              themeMode: ThemeMode.dark,
              home: MovieListScreen(),
            ));
          }

          class MovieListScreen extends StatelessWidget {
            const MovieListScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E1E1E),
                  title: const Text('Kho Phim Online', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                ),
                body: StreamBuilder<QuerySnapshot>(
                  stream: FirebaseFirestore.instance.collection('movies').snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const Center(child: CircularProgressIndicator(color: Colors.redAccent));
                    }
                    final docs = snapshot.data?.docs ?? [];
                    if (docs.isEmpty) {
                      return const Center(
                        child: Text(
                          'Chưa có phim nào.\nHãy thêm phim trên Firebase!',
                          textAlign: TextAlign.center,
                          style: TextStyle(color: Colors.white70, fontSize: 16),
                        ),
                      );
                    }
                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: docs.length,
                      itemBuilder: (context, index) {
                        final data = docs[index].data() as Map<String, dynamic>;
                        final title = data['title'] ?? 'Phim không tên';
                        final posterUrl = data['posterUrl'] ?? '';
                        final videoUrl = data['videoUrl'] ?? '';

                        return Card(
                          color: const Color(0xFF1E1E1E),
                          margin: const EdgeInsets.only(bottom: 12),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                          child: ListTile(
                            contentPadding: const EdgeInsets.all(10),
                            leading: ClipRRect(
                              borderRadius: BorderRadius.circular(8),
                              child: posterUrl.isNotEmpty
                                  ? Image.network(posterUrl, width: 60, height: 80, fit: BoxFit.cover, errorBuilder: (_, __, ___) => const Icon(Icons.movie, size: 40, color: Colors.white54))
                                  : const Icon(Icons.movie, size: 40, color: Colors.white54),
                            ),
                            title: Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                            trailing: const Icon(Icons.play_circle_fill, color: Colors.redAccent, size: 36),
                            onTap: () {
                              if (videoUrl.isNotEmpty) {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(builder: (_) => PlayerScreen(title: title, videoUrl: videoUrl)),
                                );
                              }
                            },
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          class PlayerScreen extends StatefulWidget {
            final String title;
            final String videoUrl;
            const PlayerScreen({super.key, required this.title, required this.videoUrl});

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late VideoPlayerController _videoPlayerController;
            ChewieController? _chewieController;

            @override
            void initState() {
              super.initState();
              _videoPlayerController = VideoPlayerController.networkUrl(Uri.parse(widget.videoUrl));
              _videoPlayerController.initialize().then((_) {
                setState(() {
                  _chewieController = ChewieController(
                    videoPlayerController: _videoPlayerController,
                    autoPlay: true,
                    looping: false,
                    aspectRatio: _videoPlayerController.value.aspectRatio,
                  );
                });
              });
            }

            @override
            void dispose() {
              _videoPlayerController.dispose();
              _chewieController?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(backgroundColor: Colors.black, title: Text(widget.title, style: const TextStyle(color: Colors.white))),
                body: Center(
                  child: _chewieController != null && _chewieController!.videoPlayerController.value.isInitialized
                      ? Chewie(controller: _chewieController!)
                      : const CircularProgressIndicator(color: Colors.redAccent),
                ),
              );
            }
          }
          EOF

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppPhim-Release
          path: movieapp/build/app/outputs/flutter-apk/app-release.apk
